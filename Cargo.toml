[package]
name = "wipsaw"
version = "0.1.0"
edition = "2024"
description = "Linux-first tmux workspace and WIP orchestrator for Codex"
repository = "https://github.com/jordanculver/wipsaw"
readme = "README.md"
license = "MIT"
publish = false

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
directories = "6.0.0"
libc = "0.2.189"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "layout-cache", "macros"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
uuid = { version = "1.24.0", features = ["serde", "v7"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
strip = "symbols"
